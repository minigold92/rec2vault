name: Feature request
description: Suggest a change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: dropdown
    id: data
    attributes:
      label: Would this send anything new off the Mac?
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true
