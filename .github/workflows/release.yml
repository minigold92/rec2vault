name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: npm ci
        working-directory: app
      - uses: actions/cache@v4
        with:
          path: app/.build-cache
          key: app-tools-arm64-${{ hashFiles('app/build-inputs.json') }}
      - name: Tag must match every app version field
        run: |
          v="${GITHUB_REF_NAME#v}"
          a=$(node -p "require('./app/package.json').version")
          b=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          c=$(sed -n 's/^version = "\(.*\)"/\1/p' app/src-tauri/Cargo.toml | head -1)
          echo "tag=$v package.json=$a tauri.conf.json=$b Cargo.toml=$c"
          [ "$v" = "$a" ] && [ "$v" = "$b" ] && [ "$v" = "$c" ]
      - name: Read this version's release notes
        id: notes
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const fs = require('fs');
            const version = context.ref.replace('refs/tags/v', '');
            const sections = fs.readFileSync('CHANGELOG.md', 'utf8').split(/^## /m).slice(1);
            const section = sections.find(s => s.split('\n')[0].trim() === version);
            if (!section) throw new Error(`Missing CHANGELOG section: ${version}`);
            return section.slice(section.indexOf('\n') + 1).trim();
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: QuietClerk ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.result }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          args: --target aarch64-apple-darwin --bundles app,dmg
