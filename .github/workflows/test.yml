name: test
on: [push, pull_request]
jobs:
  test:
    # ubuntu-latest moved to 26.04 (2026-11): apt there hung for an hour on unresolvable mirrors.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # The tests cover intake, correction/summary logic and rendering; they do not load MLX models.
      - run: uv run --python 3.12 --no-project --with pytest --with pyyaml --with starlette --with uvicorn --with jinja2 --with httpx --with jsonschema --with numpy python -m pytest -q tests
  macos:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: clippy
      - run: npm ci
        working-directory: app
      - uses: actions/cache@v4
        with:
          path: app/.build-cache
          key: app-tools-arm64-${{ hashFiles('app/build-inputs.json') }}
      - run: python3 scripts/prepare_app.py
      - run: cargo test --manifest-path src-tauri/Cargo.toml
        working-directory: app
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
        working-directory: app
      - run: >-
          npm run tauri -- build --target aarch64-apple-darwin --bundles app
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
        working-directory: app
