[project]
name = "rec2vault"
version = "0.1.0"
description = "Android recorder → local Korean transcription with diarization (MLX) → subscription-CLI summary → Obsidian notes"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mlx-audio==0.6.4",
  "mlx-whisper==0.4.3",
  "soundfile",
  "numpy",
  "soynlp",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
