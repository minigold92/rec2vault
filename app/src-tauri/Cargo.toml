[package]
name = "quietclerk-app"
version = "0.0.2"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
sys-locale = "0.3"
url = "2"

[dev-dependencies]
tempfile = "3"
